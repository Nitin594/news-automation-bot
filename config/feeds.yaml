# Topics to down-rank or filter out to avoid clutter
excluded_topics:
  - "crypto pump"
  - "nft drop"
  - "sponsored content"
  - "giveaway"
  - "discount code"
  - "casino"
  - "horoscope"

# Configured news feeds
feeds:
  - id: arxiv_ai
    name: "arXiv Artificial Intelligence"
    url: "https://rss.arxiv.org/rss/cs.AI"
    source_type: "rss"
    categories: ["ai_and_llms", "research_and_opensource"]
    reliability_weight: 90.0
    enabled: true
    timeout_seconds: 15
    attribution: "arXiv.org cs.AI"
    is_opportunity_source: false

