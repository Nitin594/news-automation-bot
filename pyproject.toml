[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-tech-brief"
version = "1.0.0"
description = "Autonomous personal tech news aggregator, ranker, summarizer, and multi-channel delivery digest"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Daily Tech Brief Team" }
]
dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.32.3",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
